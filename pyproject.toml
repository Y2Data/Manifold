[project]
name = "manifold-deck"
version = "0.2.0"
description = "Local complexity-based router across your existing claude/codex CLI subscriptions, with a dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# Opt-in: pulls in the Playwright browser binary (~150-300MB one-time
# download via `playwright install chromium`), which most users of the
# core router will never need. See browser_service/ and scripts/browser-*.sh.
browser = [
    "playwright>=1.47",
    "trafilatura>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "browser_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
